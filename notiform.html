<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bid on Property</title>

    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            background: #f5f6f8;
        }

        /* ===== Overlay ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        /* ===== Modal ===== */
        .modal {
            background: #fff;
            width: 100%;
            max-width: 480px;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.25s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .modal-header h2 {
            font-size: 18px;
            margin: 0;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
        }

        .listing-title {
            font-size: 14px;
            color: #555;
            margin-bottom: 16px;
        }

        /* ===== Form ===== */
        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label {
            font-size: 13px;
            font-weight: 500;
        }

        input,
        textarea,
        select {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
            width: 100%;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .row>div {
            flex: 1;
        }

        .radio-group {
            display: flex;
            gap: 15px;
            margin-top: 6px;
        }

        .radio-group label {
            font-weight: normal;
            font-size: 14px;
        }

        /* ===== Footer ===== */
        .trust-note {
            font-size: 12px;
            color: #666;
            margin-top: 6px;
        }

        .submit-btn {
            margin-top: 10px;
            background: #0f62fe;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            border-radius: 10px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #0043ce;
        }

        /* ===== Demo Button ===== */
        .open-modal-btn {
            margin: 40px;
            padding: 12px 18px;
            font-size: 16px;
            border-radius: 10px;
            border: none;
            background: #0f62fe;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- Demo Button -->
    <button class="open-modal-btn" onclick="openModal()">
        Bid / Negotiate
    </button>

    <!-- Modal -->
    <div class="modal-overlay" id="bidModal">
        <div class="modal">

            <div class="modal-header">
                <h2>Make an Offer</h2>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>

            <div class="listing-title">
                Bidding for: <strong>3-Bedroom Flat in Lekki</strong>
            </div>

            <form>
                <div>
                    <label>Full Name</label>
                    <input type="text" placeholder="Your full name" required>
                </div>

                <div>
                    <label>Phone Number</label>
                    <input type="tel" placeholder="e.g. 08012345678" required>
                </div>

                <div>
                    <label>Offer Amount (₦)</label>
                    <input type="number" placeholder="Amount you are offering" required>
                </div>

                <div>
                    <label>Family Type</label>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="familyType" value="husband_and_wife" required>
                            Husband & Wife
                        </label>
                        <label>
                            <input type="radio" name="familyType" value="single_parent">
                            Single Parent
                        </label>
                    </div>
                </div>

                <div class="row">
                    <div>
                        <label>Number of Children</label>
                        <input type="number" min="0" placeholder="0">
                    </div>
                </div>

                <div>
                    <label>Additional Comments</label>
                    <textarea placeholder="Any extra information you want the agent to know"></textarea>
                </div>

                <div class="trust-note">
                    Your details will only be shared with the property owner.
                </div>

                <button type="submit" class="submit-btn">
                    Submit Offer
                </button>
            </form>

        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById('bidModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('bidModal').classList.remove('active');
        }
    </script>

</body>

</html>
