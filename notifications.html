<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notifications - Hauser NG</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
        rel="stylesheet">

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary-bg: #f8fafc;
            --card-bg: #ffffff;
            --primary-orange: #ea580c;
            --secondary-orange: #f97316;
            --slate-800: #1e293b;
            --slate-700: #334155;
            --slate-600: #475569;
            --slate-500: #64748b;
            --slate-400: #94a3b8;
            --slate-300: #cbd5e1;
            --slate-200: #e2e8f0;
            --slate-100: #f1f5f9;
            --success-green: #059669;
            --border-light: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--primary-bg);
            min-height: 100vh;
            color: var(--slate-800);
            line-height: 1.6;
            font-size: 15px;
        }

        h1,
        h2,
        h3 {
            font-family: 'Manrope', sans-serif;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        /* Navbar */
        .navbar {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
            padding: 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary-orange), var(--secondary-orange));
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: var(--shadow-sm);
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--slate-800);
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            color: var(--slate-700);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }

        .back-link:hover {
            background: var(--slate-100);
            border-color: var(--primary-orange);
        }

        .back-link svg {
            width: 18px;
            height: 18px;
        }

        /* Main Container */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .page-header {
            margin-bottom: 2rem;
            text-align: center;
        }

        .page-title {
            font-size: clamp(1.75rem, 4vw, 2.5rem);
            margin-bottom: 0.5rem;
        }

        .page-subtitle {
            font-size: 1.0625rem;
            color: var(--slate-600);
        }

        /* Filters */
        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            color: var(--slate-700);
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .filter-btn:hover {
            background: var(--slate-100);
        }

        .filter-btn.active {
            background: var(--primary-orange);
            color: white;
            border-color: var(--primary-orange);
        }

        /* Notifications Grid */
        .notifications-grid {
            display: grid;
            gap: 1rem;
        }

        .notification-card {
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .notification-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--primary-orange);
        }

        .notification-card.unread {
            border-left: 4px solid var(--primary-orange);
            background: rgba(234, 88, 12, 0.02);
        }

        .notification-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
            gap: 1rem;
        }

        .notification-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--slate-800);
            flex: 1;
        }

        .notification-badge {
            padding: 0.25rem 0.75rem;
            background: var(--success-green);
            color: white;
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .notification-badge.unread {
            background: var(--primary-orange);
        }

        .notification-content {
            display: grid;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .notification-detail {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9375rem;
            color: var(--slate-600);
        }

        .detail-label {
            font-weight: 600;
            color: var(--slate-700);
        }

        .detail-value {
            color: var(--slate-600);
        }

        .bid-amount {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-orange);
        }

        .notification-message {
            padding: 1rem;
            background: var(--slate-100);
            border-radius: var(--radius-md);
            font-size: 0.9375rem;
            color: var(--slate-700);
            line-height: 1.6;
            border-left: 3px solid var(--slate-300);
        }

        .notification-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid var(--border-light);
            gap: 1rem;
        }

        .notification-time {
            font-size: 0.8125rem;
            color: var(--slate-500);
        }

        .action-buttons {
            display: flex;
            gap: 0.75rem;
        }

        .action-btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            background: var(--card-bg);
            color: var(--slate-700);
        }

        .action-btn:hover {
            background: var(--slate-100);
        }

        .action-btn.primary {
            background: var(--primary-orange);
            color: white;
            border-color: var(--primary-orange);
        }

        .action-btn.primary:hover {
            background: var(--secondary-orange);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            border: 2px dashed var(--border-light);
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        .empty-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--slate-700);
        }

        .empty-subtitle {
            font-size: 0.9375rem;
            color: var(--slate-500);
        }

        /* Loading */
        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 3rem;
            gap: 0.5rem;
        }

        .loader-circle {
            width: 12px;
            height: 12px;
            background: var(--primary-orange);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loader-circle:nth-child(1) {
            animation-delay: -0.32s;
        }

        .loader-circle:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-container {
                padding: 1.5rem 1rem;
            }

            .notification-card {
                padding: 1.25rem;
            }

            .notification-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .notification-footer {
                flex-direction: column;
                align-items: flex-start;
            }

            .action-buttons {
                width: 100%;
                flex-direction: column;
            }

            .action-btn {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .notification-card {
                padding: 1rem;
            }
        }

        .logoup {
            height: 100px;
            width: auto;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <header class="navbar">
        <div class="navbar-container">
            <div class="logo-section">
                <img src="/img/logo.png" alt="Hauser NG Logo" class="logoup">
            </div>
            <a href="dashboard.html" class="back-link">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Back to Dashboard
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-container">
        <div class="page-header">
            <h1 class="page-title">Notifications</h1>
            <p class="page-subtitle">Bids and offers on your properties</p>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="unread">Unread</button>
            <button class="filter-btn" data-filter="read">Read</button>
        </div>

        <div class="loader" id="loader">
            <div class="loader-circle"></div>
            <div class="loader-circle"></div>
            <div class="loader-circle"></div>
        </div>

        <div id="notificationsList" class="notifications-grid"></div>
    </main>

    <script>
        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyAHqg_u1DwWUB9l1vuoYDLKjCJl5Xx7Pbo",
            authDomain: "hauserng-77cc2.firebaseapp.com",
            projectId: "hauserng-77cc2",
            storageBucket: "hauserng-77cc2.appspot.com",
            messagingSenderId: "613578175402",
            appId: "1:613578175402:web:db7413f898987ac6a1f1d3"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let allBids = [];
        let currentFilter = 'all';

        // Auth check
        auth.onAuthStateChanged(user => {
            if (user) {
                loadNotifications(user.uid);
                markAllAsRead(user.uid);
            } else {
                window.location.href = "login.html";
            }
        });

        // Load bids (notifications)
        function loadNotifications(uid) {
            const loader = document.getElementById('loader');
            const list = document.getElementById('notificationsList');

            db.collection('bids')
                .where('listingOwnerUid', '==', uid)
                .orderBy('createdAt', 'desc')
                .get()
                .then(snapshot => {
                    loader.style.display = 'none';

                    allBids = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));

                    renderNotifications();
                })
                .catch(error => {
                    console.error('Error loading bids:', error);
                    loader.style.display = 'none';
                    list.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">⚠️</div>
              <h3 class="empty-title">Error Loading Notifications</h3>
              <p class="empty-subtitle">Please refresh the page to try again</p>
            </div>
          `;
                });
        }

        // Mark all unread bids as read
        async function markAllAsRead(uid) {
            try {
                const snapshot = await db.collection('bids')
                    .where('listingOwnerUid', '==', uid)
                    .where('status', '==', 'unread')
                    .get();

                if (!snapshot.empty) {
                    const batch = db.batch();
                    snapshot.forEach(doc => {
                        batch.update(doc.ref, {
                            status: 'read',
                            readAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    });
                    await batch.commit();
                    //  console.log('✅ Marked', snapshot.size, 'bids as read');
                }
            } catch (error) {
                console.error('Error marking as read:', error);
            }
        }

        // Render notifications
        function renderNotifications() {
            const list = document.getElementById('notificationsList');

            let filtered = allBids;
            if (currentFilter === 'unread') {
                filtered = allBids.filter(bid => bid.status === 'unread');
            } else if (currentFilter === 'read') {
                filtered = allBids.filter(bid => bid.status === 'read');
            }

            if (filtered.length === 0) {
                list.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🔔</div>
            <h3 class="empty-title">No ${currentFilter === 'all' ? '' : currentFilter} notifications</h3>
            <p class="empty-subtitle">You're all caught up!</p>
          </div>
        `;
                return;
            }

            list.innerHTML = '';
            filtered.forEach(bid => {
                const card = createNotificationCard(bid);
                list.appendChild(card);
            });
        }

        // Create notification card
        function createNotificationCard(bid) {
            const card = document.createElement('div');
            card.className = `notification-card ${bid.status === 'unread' ? 'unread' : ''}`;

            const timeAgo = getTimeAgo(bid.createdAt);
            const familyType = bid.familyType?.replace('_', ' ') || 'Not specified';

            card.innerHTML = `
        <div class="notification-header">
          <h3 class="notification-title">New Bid on: ${bid.listingTitle || 'Your Property'}</h3>
          <span class="notification-badge ${bid.status === 'unread' ? 'unread' : ''}">${bid.status}</span>
        </div>
        
        <div class="notification-content">
          <div class="notification-detail">
            <span class="detail-label">From:</span>
            <span class="detail-value">${bid.bidderName || 'Anonymous'}</span>
          </div>
          
          <div class="notification-detail">
            <span class="detail-label">Offer Amount:</span>
            <span class="bid-amount">₦${(bid.bidAmount || 0).toLocaleString()}</span>
          </div>
          
          <div class="notification-detail">
            <span class="detail-label">Phone:</span>
            <span class="detail-value">${bid.bidderPhone || 'Not provided'}</span>
          </div>
          
          <div class="notification-detail">
            <span class="detail-label">Family Type:</span>
            <span class="detail-value">${familyType}</span>
          </div>
          
          <div class="notification-detail">
            <span class="detail-label">Children:</span>
            <span class="detail-value">${bid.childrenCount || 0}</span>
          </div>
          
          ${bid.message ? `
            <div class="notification-message">
              <strong>Message:</strong><br>
              ${bid.message}
            </div>
          ` : ''}
        </div>
        
        <div class="notification-footer">
          <span class="notification-time">${timeAgo}</span>
          <div class="action-buttons">
            <a href="tel:${bid.bidderPhone}" class="action-btn primary">Call Bidder</a>
            <button class="action-btn" onclick="deleteBid('${bid.id}')">Dismiss</button>
          </div>
        </div>
      `;

            return card;
        }

        // Get time ago
        function getTimeAgo(timestamp) {
            if (!timestamp) return 'Just now';

            const now = Date.now();
            const time = timestamp.toMillis ? timestamp.toMillis() : timestamp;
            const diff = now - time;

            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);

            if (minutes < 1) return 'Just now';
            if (minutes < 60) return `${minutes} minute${minutes > 1 ? 's' : ''} ago`;
            if (hours < 24) return `${hours} hour${hours > 1 ? 's' : ''} ago`;
            return `${days} day${days > 1 ? 's' : ''} ago`;
        }

        // Delete bid
        async function deleteBid(bidId) {
            if (!confirm('Are you sure you want to dismiss this bid?')) return;

            try {
                await db.collection('bids').doc(bidId).delete();
                allBids = allBids.filter(bid => bid.id !== bidId);
                renderNotifications();
            } catch (error) {
                console.error('Error deleting bid:', error);
                alert('Failed to dismiss bid. Please try again.');
            }
        }

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderNotifications();
            });
        });
    </script>
</body>

</html>
