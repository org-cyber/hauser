<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analytics - Hauser NG</title>

    <!-- Google Fonts: Inter + Manrope -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
        rel="stylesheet">

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            /* Professional Business Colors with Orange Accent */
            --primary-bg: #f8fafc;
            --secondary-bg: #f1f5f9;
            --card-bg: #ffffff;
            --primary-orange: #ea580c;
            --secondary-orange: #f97316;
            --accent-orange: #fb923c;
            --orange-light: #fed7aa;
            --dark-slate: #0f172a;
            --slate-900: #0f172a;
            --slate-800: #1e293b;
            --slate-700: #334155;
            --slate-600: #475569;
            --slate-500: #64748b;
            --slate-400: #94a3b8;
            --slate-300: #cbd5e1;
            --slate-200: #e2e8f0;
            --slate-100: #f1f5f9;
            --success-green: #059669;
            --chart-blue: #3b82f6;
            --chart-indigo: #6366f1;
            --chart-cyan: #06b6d4;
            --chart-teal: #14b8a6;
            --chart-emerald: #10b981;
            --chart-purple: #8b5cf6;
            --border-light: #e2e8f0;
            --border-medium: #cbd5e1;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            --radius-sm: 0.375rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--primary-bg);
            min-height: 100vh;
            color: var(--slate-800);
            line-height: 1.6;
            font-size: 15px;
        }

        h1,
        h2,
        h3,
        .analytics-title,
        .chart-title,
        .property-title {
            font-family: 'Manrope', sans-serif;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        /* Navbar */
        .navbar {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
            padding: 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary-orange), var(--secondary-orange));
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
        }

        .logo-icon svg {
            width: 22px;
            height: 22px;
            fill: white;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--slate-800);
        }

        .nav-links {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .nav-link {
            color: var(--slate-600);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9375rem;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-md);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-link:hover {
            background: var(--slate-100);
            color: var(--primary-orange);
        }

        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 4px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
        }

        .menu-toggle span {
            width: 24px;
            height: 2px;
            background: var(--slate-700);
            border-radius: 2px;
            transition: var(--transition);
        }

        /* Main Layout */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .page-header {
            margin-bottom: 2rem;
            animation: fadeInDown 0.6s ease;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .analytics-title {
            font-size: clamp(1.875rem, 4vw, 2.5rem);
            font-weight: 700;
            color: var(--slate-800);
            margin-bottom: 0.5rem;
        }

        .analytics-subtitle {
            font-size: 1rem;
            color: var(--slate-600);
            max-width: 600px;
        }

        /* Charts Grid */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 500px), 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .chart-card {
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
            transition: var(--transition);
            animation: fadeInUp 0.6s ease both;
        }

        .chart-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .chart-card:nth-child(1) {
            animation-delay: 0.1s;
        }

        .chart-card:nth-child(2) {
            animation-delay: 0.2s;
        }

        .chart-card:nth-child(3) {
            animation-delay: 0.3s;
        }

        .chart-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            color: var(--slate-800);
        }

        .chart-container {
            position: relative;
            height: 320px;
        }

        /* Property Cards */
        .properties-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
            gap: 1.5rem;
        }

        .property-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.6s ease both;
        }

        .property-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-orange), var(--secondary-orange));
        }

        .property-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-4px);
        }

        .property-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--slate-800);
            line-height: 1.4;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1rem;
        }

        .stat-item {
            text-align: center;
            padding: 1rem;
            background: var(--slate-100);
            border-radius: var(--radius-md);
        }

        .stat-value {
            font-size: 1.875rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            font-family: 'DM Sans', sans-serif;
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--slate-600);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .clicks-value {
            color: var(--primary-orange);
        }

        .bids-value {
            color: var(--success-green);
        }

        .property-rank {
            font-size: 0.875rem;
            color: var(--slate-600);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-light);
        }

        .rank-badge {
            background: var(--slate-800);
            color: white;
            min-width: 28px;
            height: 28px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.875rem;
        }

        .rank-badge.top-3 {
            background: linear-gradient(135deg, var(--primary-orange), var(--secondary-orange));
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--slate-500);
            font-size: 0.9375rem;
            grid-column: 1 / -1;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            border: 2px dashed var(--border-medium);
        }

        .empty-state-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 1.5rem;
            opacity: 0.3;
        }

        .empty-state-icon svg {
            width: 100%;
            height: 100%;
            fill: var(--slate-400);
        }

        /* Professional Loading Animation */
        .loader-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 300px;
            grid-column: 1 / -1;
        }

        .chart-loader-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--card-bg);
            z-index: 10;
        }

        .chart-loader-container.hidden {
            display: none;
        }

        /* From Uiverse.io by AbanoubMagdy1 */
        .loader {
            --dim: 3rem;
            width: var(--dim);
            height: var(--dim);
            position: relative;
            animation: spin988 2s linear infinite;
        }

        .loader .circle {
            --color: #333;
            --dim: 1.2rem;
            width: var(--dim);
            height: var(--dim);
            background-color: var(--color);
            border-radius: 50%;
            position: absolute;
        }

        .loader .circle:nth-child(1) {
            top: 0;
            left: 0;
        }

        .loader .circle:nth-child(2) {
            top: 0;
            right: 0;
        }

        .loader .circle:nth-child(3) {
            bottom: 0;
            left: 0;
        }

        .loader .circle:nth-child(4) {
            bottom: 0;
            right: 0;
        }

        @keyframes spin988 {
            0% {
                transform: scale(1) rotate(0);
            }

            20%,
            25% {
                transform: scale(1.3) rotate(90deg);
            }

            45%,
            50% {
                transform: scale(1) rotate(180deg);
            }

            70%,
            75% {
                transform: scale(1.3) rotate(270deg);
            }

            95%,
            100% {
                transform: scale(1) rotate(360deg);
            }
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .main-container {
                padding: 1.5rem 1rem;
            }

            .menu-toggle {
                display: flex;
            }

            .nav-links {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: var(--card-bg);
                flex-direction: column;
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.3s ease;
                box-shadow: var(--shadow-lg);
                border-top: 1px solid var(--border-light);
            }

            .nav-links.active {
                max-height: 400px;
                padding: 1rem;
            }

            .nav-link {
                width: 100%;
                justify-content: flex-start;
            }

            .chart-container {
                height: 280px;
            }

            .properties-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                gap: 0.75rem;
            }

            .stat-value {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .navbar-container {
                padding: 1rem;
            }

            .logo-text {
                font-size: 1.25rem;
            }

            .logo-icon {
                width: 36px;
                height: 36px;
            }

            .logo-icon svg {
                width: 20px;
                height: 20px;
            }

            .analytics-title {
                font-size: 1.5rem;
            }

            .analytics-subtitle {
                font-size: 0.875rem;
            }

            .chart-container {
                height: 240px;
            }

            .chart-card {
                padding: 1.25rem;
            }

            .property-card {
                padding: 1.25rem;
            }
        }

        /* Print Styles */
        @media print {

            .navbar,
            .menu-toggle {
                display: none;
            }

            .chart-card,
            .property-card {
                break-inside: avoid;
                box-shadow: none;
                border: 1px solid var(--border-medium);
            }

            body {
                background: white;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="navbar-container">
            <div class="logo-section">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M3 9.5L12 3L21 9.5V20C21 20.5304 20.7893 21.0391 20.4142 21.4142C20.0391 21.7893 19.5304 22 19 22H5C4.46957 22 3.96086 21.7893 3.58579 21.4142C3.21071 21.0391 3 20.5304 3 20V9.5Z"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            fill="white" />
                        <path d="M9 22V12H15V22" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </div>
                <h1 class="logo-text">Hauser NG</h1>
            </div>

            <button class="menu-toggle" onclick="toggleMenu()" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="nav-links" id="navLinks">
                <a href="dashboard.html" class="nav-link">← Back to Dashboard</a>
                <a href="vacancies.html" class="nav-link">Vacancies</a>
                <a href="add-property.html" class="nav-link">Add Property</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-container">
        <header class="page-header">
            <h1 class="analytics-title">Property Analytics</h1>
            <p class="analytics-subtitle">Track clicks and bids to see which listings are generating the most interest
            </p>
        </header>

        <!-- Charts -->
        <div class="charts-grid" id="chartsGrid">
            <div class="chart-card">
                <h3 class="chart-title">More Details Clicks per Property</h3>
                <div class="chart-container">
                    <canvas id="clicksChart"></canvas>
                    <div class="chart-loader-container" id="clicksLoader">
                        <div class="loader">
                            <div class="circle"></div>
                            <div class="circle"></div>
                            <div class="circle"></div>
                            <div class="circle"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="chart-card">
                <h3 class="chart-title">Bids Received per Property</h3>
                <div class="chart-container">
                    <canvas id="bidsChart"></canvas>
                    <div class="chart-loader-container" id="bidsLoader">
                        <div class="loader">
                            <div class="circle"></div>
                            <div class="circle"></div>
                            <div class="circle"></div>
                            <div class="circle"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="chart-card">
                <h3 class="chart-title">Click Distribution</h3>
                <div class="chart-container">
                    <canvas id="pieChart"></canvas>
                    <div class="chart-loader-container" id="pieLoader">
                        <!-- From Uiverse.io by AbanoubMagdy1 -->
                        <div class="loader">
                            <div class="circle"></div>
                            <div class="circle"></div>
                            <div class="circle"></div>
                            <div class="circle"></div>
                        </div>


                    </div>
                </div>
            </div>
        </div>

        <!-- Property Cards -->
        <div id="propertiesContainer" class="properties-grid">
            <div class="loader-container">
                <div class="loader">
                    <div class="circle"></div>
                    <div class="circle"></div>
                    <div class="circle"></div>
                    <div class="circle"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function toggleMenu() {
            document.getElementById('navLinks').classList.toggle('active');
        }

        // Firebase init
        const firebaseConfig = {
            apiKey: "AIzaSyAHqg_u1DwWUB9l1vuoYDLKjCJl5Xx7Pbo",
            authDomain: "hauserng-77cc2.firebaseapp.com",
            projectId: "hauserng-77cc2",
            storageBucket: "hauserng-77cc2.appspot.com",
            messagingSenderId: "613578175402",
            appId: "1:613578175402:web:db7413f898987ac6a1f1d3"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let clicksChart, bidsChart, pieChart;

        auth.onAuthStateChanged(user => {
            if (!user) window.location.href = "login.html";
            else loadAnalytics(user.uid);
        });

        async function loadAnalytics(uid) {
            const properties = [];

            try {
                const snapshot = await db.collection('properties')
                    .where('uid', '==', uid)
                    .get();

                for (const doc of snapshot.docs) {
                    const p = doc.data();
                    p.id = doc.id;

                    // Count clicks from separate collection
                    const clicksSnap = await db.collection('propertyClicks')
                        .where('propertyId', '==', p.id)
                        .get();
                    const clicks = clicksSnap.size;

                    // Bids count directly from property document
                    const bids = p.bidsCount || 0;

                    properties.push({ ...p, clicks, bids });
                }

                // Sort by total engagement (clicks + bids)
                properties.sort((a, b) => (b.clicks + b.bids) - (a.clicks + a.bids));

                renderCharts(properties);
                renderPropertyCards(properties);
            } catch (error) {
                console.error('Error loading analytics:', error);
                showError();
            }
        }

        function renderCharts(properties) {
            const labels = properties.map(p => {
                const title = p.title || 'Untitled';
                return title.length > 30 ? title.slice(0, 30) + '...' : title;
            });
            const clicksData = properties.map(p => p.clicks);
            const bidsData = properties.map(p => p.bids);

            // Professional color palette with orange as primary
            const colors = [
                '#ea580c', '#f97316', '#3b82f6', '#6366f1',
                '#06b6d4', '#14b8a6', '#10b981', '#8b5cf6'
            ];

            const backgroundColors = colors.map(c => c + 'cc');
            const borderColors = colors;

            // Clicks Bar Chart
            const clicksCtx = document.getElementById('clicksChart').getContext('2d');
            if (clicksChart) clicksChart.destroy();
            clicksChart = new Chart(clicksCtx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Clicks',
                        data: clicksData,
                        backgroundColor: backgroundColors,
                        borderColor: borderColors,
                        borderWidth: 0,
                        borderRadius: 6,
                        barThickness: 'flex',
                        maxBarThickness: 60,
                    }]
                },
                options: getChartOptions('Clicks')
            });

            // Hide clicks chart loader
            document.getElementById('clicksLoader').classList.add('hidden');

            // Bids Bar Chart
            const bidsCtx = document.getElementById('bidsChart').getContext('2d');
            if (bidsChart) bidsChart.destroy();
            bidsChart = new Chart(bidsCtx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Bids',
                        data: bidsData,
                        backgroundColor: backgroundColors,
                        borderColor: borderColors,
                        borderWidth: 0,
                        borderRadius: 6,
                        barThickness: 'flex',
                        maxBarThickness: 60,
                    }]
                },
                options: getChartOptions('Bids')
            });

            // Hide bids chart loader
            document.getElementById('bidsLoader').classList.add('hidden');

            // Click Distribution (Doughnut)
            const pieCtx = document.getElementById('pieChart').getContext('2d');
            if (pieChart) pieChart.destroy();
            pieChart = new Chart(pieCtx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: clicksData,
                        backgroundColor: colors,
                        borderColor: '#ffffff',
                        borderWidth: 3,
                        hoverOffset: 8,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                padding: 16,
                                font: { size: 11, family: 'Inter', weight: '500' },
                                usePointStyle: true,
                                boxWidth: 8,
                                boxHeight: 8,
                                color: '#475569'
                            }
                        },
                        tooltip: {
                            backgroundColor: '#0f172a',
                            padding: 12,
                            cornerRadius: 8,
                            titleFont: { size: 13, family: 'Manrope', weight: '600' },
                            bodyFont: { size: 14, weight: '500', family: 'Inter' },
                            callbacks: {
                                label: ctx => {
                                    const value = ctx.parsed;
                                    const total = ctx.dataset.data.reduce((a, b) => a + b, 0);
                                    const percentage = total ? ((value / total) * 100).toFixed(1) : 0;
                                    return ` ${value} clicks (${percentage}%)`;
                                }
                            }
                        }
                    },
                    cutout: '65%',
                    animation: {
                        animateRotate: true,
                        duration: 1000,
                        easing: 'easeOutQuart'
                    }
                }
            });

            // Hide pie chart loader
            document.getElementById('pieLoader').classList.add('hidden');
        }

        function getChartOptions(label) {
            return {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: '#0f172a',
                        padding: 12,
                        cornerRadius: 8,
                        titleFont: { size: 13, family: 'Manrope', weight: '600' },
                        bodyFont: { size: 14, weight: '600', family: 'Inter' },
                        callbacks: {
                            label: ctx => ` ${ctx.parsed.y} ${label.toLowerCase()}`
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: {
                            color: '#f1f5f9',
                            drawBorder: false,
                        },
                        ticks: {
                            font: { family: 'Inter', size: 11 },
                            color: '#64748b',
                            padding: 8
                        },
                        border: { display: false }
                    },
                    x: {
                        grid: { display: false, drawBorder: false },
                        ticks: {
                            font: { family: 'Inter', size: 11 },
                            color: '#64748b',
                            maxRotation: 45,
                            minRotation: 0
                        },
                        border: { display: false }
                    }
                },
                animation: {
                    duration: 800,
                    easing: 'easeOutQuart'
                }
            };
        }

        function renderPropertyCards(properties) {
            const container = document.getElementById('propertiesContainer');
            container.innerHTML = '';

            if (properties.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
                                <rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
                                <rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
                                <rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
                            </svg>
                        </div>
                        <div>No properties listed yet. Start adding listings to see analytics!</div>
                    </div>`;
                return;
            }

            properties.forEach((p, index) => {
                const card = document.createElement('div');
                card.className = 'property-card';
                card.style.animationDelay = `${index * 0.05}s`;

                const rank = index + 1;
                const rankSuffix = rank === 1 ? 'st' : rank === 2 ? 'nd' : rank === 3 ? 'rd' : 'th';

                card.innerHTML = `
                    <div class="property-title">${p.title || 'Untitled Property'}</div>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-value clicks-value">${p.clicks}</div>
                            <div class="stat-label">Clicks</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value bids-value">${p.bids}</div>
                            <div class="stat-label">Bids</div>
                        </div>
                    </div>
                    <div class="property-rank">
                        <div class="rank-badge ${rank <= 3 ? 'top-3' : ''}">${rank}</div>
                        <span>${rank}${rankSuffix} Overall Performance</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function showError() {
            const container = document.getElementById('propertiesContainer');
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                            <path d="M12 8V12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <circle cx="12" cy="16" r="1" fill="currentColor"/>
                        </svg>
                    </div>
                    <div>Unable to load analytics data. Please try again later.</div>
                </div>`;
        }

        // Close mobile menu when clicking outside
        document.addEventListener('click', (e) => {
            const navLinks = document.getElementById('navLinks');
            const menuToggle = document.querySelector('.menu-toggle');

            if (navLinks.classList.contains('active') &&
                !navLinks.contains(e.target) &&
                !menuToggle.contains(e.target)) {
                navLinks.classList.remove('active');
            }
        });
    </script>
</body>

</html>
