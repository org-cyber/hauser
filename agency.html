<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Agency...</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap"
        rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            /* Modern Light Glass Palette */
            --navy-deep: #0f172a;
            --navy-soft: #1e293b;
            --accent-gold: #c5a059;
            --bg-main: #f1f5f9;

            /* Glassmorphism */
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.7);
            --glass-shadow: 0 8px 32px 0 rgba(15, 23, 42, 0.08);

            --radius-lg: 1.25rem;
            --radius-xl: 2.5rem;
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            background-image:
                radial-gradient(at 0% 0%, rgba(197, 160, 89, 0.08) 0, transparent 40%),
                radial-gradient(at 100% 100%, rgba(15, 23, 42, 0.05) 0, transparent 40%);
            background-attachment: fixed;
            color: var(--navy-deep);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Glass Utility Classes */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        /* Loading State */
        .loading-container {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #e2e8f0;
            border-top-color: var(--navy-deep);
            border-radius: 50%;
            animation: spin 1s infinite linear;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Navigation - Floating Pill */
        .nav-bar {
            position: fixed;
            top: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1200px;
            border-radius: 100px;
            z-index: 1000;
            transition: var(--transition);
        }

        .nav-bar.scrolled {
            top: 0.75rem;
            width: 95%;
            background: rgba(255, 255, 255, 0.85);
        }

        .nav-container {
            padding: 0.75rem 2.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--navy-deep);
        }

        .nav-logo {
            height: 40px;
        }

        .nav-contact {
            display: flex;
            gap: 1.5rem;
        }

        .nav-contact-item {
            color: var(--navy-soft);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            transition: var(--transition);
        }

        .nav-contact-item:hover {
            background: white;
            color: var(--accent-gold);
        }

        /* Hero Section */
        .hero-section {
            height: 92vh;
            padding: 2rem;
            padding-top: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-card {
            width: 100%;
            max-width: 1400px;
            height: 100%;
            border-radius: var(--radius-xl);
            position: relative;
            overflow: hidden;
            box-shadow: 0 30px 60px -12px rgba(15, 23, 42, 0.15);
        }

        .hero-media-container {
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        .hero-image,
        .hero-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(105deg, rgba(255, 255, 255, 0.9) 30%, rgba(255, 255, 255, 0.1));
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            padding: 5rem;
            max-width: 800px;
            animation: fadeInBlur 1.2s ease;
        }

        @keyframes fadeInBlur {
            from {
                opacity: 0;
                transform: translateX(-40px);
                filter: blur(10px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
                filter: blur(0);
            }
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3rem, 6vw, 5rem);
            line-height: 1.1;
            margin-bottom: 2rem;
            color: var(--navy-deep);
        }

        .hero-tagline {
            font-size: 1.2rem;
            color: var(--navy-soft);
            margin-bottom: 3rem;
            padding-left: 1.5rem;
            border-left: 3px solid var(--accent-gold);
        }

        /* Property Cards - Professional White Base */
        .properties-section {
            padding: 8rem 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 5rem;
        }

        .section-label {
            display: block;
            font-weight: 800;
            font-size: 0.75rem;
            letter-spacing: 0.2rem;
            color: var(--accent-gold);
            margin-bottom: 1rem;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
        }

        .properties-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 2.5rem;
        }

        .property-card {
            background: #ffffff;
            /* Writeups must be solid */
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: var(--transition);
            border: 1px solid #f1f5f9;
        }

        .property-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 30px 60px -15px rgba(15, 23, 42, 0.12);
        }

        .property-image-container {
            height: 300px;
            overflow: hidden;
            position: relative;
        }

        .property-image,
        .property-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.8s;
        }

        .property-card:hover .property-image {
            transform: scale(1.08);
        }

        .property-badge {
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
            padding: 0.6rem 1rem;
            background: rgba(15, 23, 42, 0.8);
            color: white;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 800;
        }

        .property-content {
            padding: 2.5rem;
        }

        .property-price {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--accent-gold);
            margin-bottom: 0.5rem;
            font-weight: 800;
        }

        .property-title {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            font-weight: 700;
            color: var(--navy-deep);
        }

        .property-location {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        /* Bid Button Styling */
        .bid-btn {
            width: 100%;
            padding: 1.1rem;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            color: var(--navy-deep);
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }

        .bid-btn:hover {
            background: var(--navy-deep);
            color: white;
        }

        /* Modal Design - Glassified overlay, solid modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 2rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: var(--radius-xl);
            padding: 3.5rem;
            width: 100%;
            max-width: 550px;
            position: relative;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.2);
            animation: modalPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalPop {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            margin-bottom: 1rem;
        }

        .close-modal-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            border: none;
            background: #f1f5f9;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
        }

        .modal input,
        .modal textarea {
            width: 100%;
            padding: 1rem 1.25rem;
            margin-bottom: 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #f8fafc;
            font-family: inherit;
            transition: var(--transition);
        }

        .modal input:focus {
            outline: none;
            border-color: var(--accent-gold);
            background: white;
            box-shadow: 0 0 0 4px rgba(197, 160, 89, 0.1);
        }

        .radio-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .radio-option input {
            display: none;
        }

        .radio-custom {
            display: block;
            padding: 1rem;
            text-align: center;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .radio-option input:checked+.radio-custom {
            background: var(--navy-deep);
            color: white;
            border-color: var(--navy-deep);
        }

        .submit-btn {
            width: 100%;
            padding: 1.2rem;
            background: var(--navy-deep);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition);
        }

        .submit-btn:hover {
            background: var(--accent-gold);
            transform: translateY(-2px);
        }

        /* Responsive Fixes */
        @media (max-width: 768px) {
            .hero-content {
                padding: 2rem;
            }

            .nav-contact {
                display: none;
            }

            .properties-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div id="loadingContainer" class="loading-container">
        <div class="loading-spinner"></div>
        <p style="margin-top: 1.5rem; font-weight: 700;">Curating Experience...</p>
    </div>

    <div id="mainContent" style="display: none;">
        <nav class="nav-bar glass-panel" id="navbar">
            <div class="nav-container">
                <div>
                    <img id="navLogo" class="nav-logo" alt="Logo" style="display: none;">
                    <span id="navBrand" class="nav-brand">Agency</span>
                </div>
                <div class="nav-contact">
                    <a href="#" id="navPhone" class="nav-contact-item">
                        <i data-lucide="phone" size="16"></i> <span id="navPhoneText"></span>
                    </a>
                    <a href="#" id="navEmail" class="nav-contact-item">
                        <i data-lucide="mail" size="16"></i> <span id="navEmailText"></span>
                    </a>
                </div>
            </div>
        </nav>

        <section class="hero-section">
            <div class="hero-card">
                <div class="hero-media-container" id="heroMediaContainer">
                    <img id="heroImage" class="hero-image" alt="Background" style="display: none;">
                    <video id="heroVideo" class="hero-video" loop muted style="display: none;"></video>
                    <div class="hero-overlay"></div>
                </div>
                <div class="hero-content">
                    <h1 id="heroTitle" class="hero-title">Exclusive Estates</h1>
                    <p id="heroTagline" class="hero-tagline" style="display: none;"></p>
                    <a href="#properties" class="hero-cta"
                        style="display: inline-flex; align-items: center; gap: 1rem; padding: 1.2rem 2.5rem; background: var(--navy-deep); color: white; text-decoration: none; border-radius: 100px; font-weight: 800;">
                        <span>Explore Collection</span>
                        <i data-lucide="arrow-down"></i>
                    </a>
                </div>
            </div>
        </section>

        <div id="statsBar"
            style="display: none; margin: -50px auto 0; max-width: 1000px; position: relative; z-index: 10; padding: 0 1.5rem;">
            <div class="glass-panel"
                style="display: flex; justify-content: space-around; padding: 2.5rem; border-radius: 2rem;">
                <div style="text-align: center;">
                    <span id="propertyCount"
                        style="font-family: 'Playfair Display', serif; font-size: 2.5rem; font-weight: 800; display: block;">0</span>
                    <span style="font-size: 0.75rem; letter-spacing: 0.1rem; color: #64748b; font-weight: 800;">TOTAL
                        LISTINGS</span>
                </div>
                <div style="text-align: center;">
                    <span
                        style="font-family: 'Playfair Display', serif; font-size: 2.5rem; font-weight: 800; display: block;">Elite</span>
                    <span style="font-size: 0.75rem; letter-spacing: 0.1rem; color: #64748b; font-weight: 800;">ADVISORY
                        SERVICE</span>
                </div>
            </div>
        </div>

        <section class="properties-section" id="properties">
            <div class="section-header">
                <span class="section-label">CURATED COLLECTION</span>
                <h2 class="section-title">Available Offerings</h2>
            </div>
            <div id="propertiesGrid" class="properties-grid"></div>
        </section>

        <footer style="padding: 5rem 2rem; border-top: 1px solid #e2e8f0; text-align: center;">
            <div class="nav-brand" id="footerAgencyName" style="margin-bottom: 1rem;">Agency</div>
            <p style="color: #94a3b8; font-size: 0.9rem;">&copy; <span id="footerYear"></span> | Architecture by Hauser
                NG</p>
        </footer>
    </div>

    <div id="errorContainer" style="display:none; text-align:center; padding-top: 20vh;">
        <h1 class="section-title">Agency Not Found</h1>
        <a href="/">Back to Home</a>
    </div>

    <div class="modal-overlay" id="bidModal">
        <div class="modal">
            <button class="close-modal-btn">✕</button>
            <h2>Private Inquiry</h2>
            <div style="margin-bottom: 2rem; color: #64748b;">Property: <strong id="modalListingTitle"
                    style="color: var(--navy-deep);"></strong></div>

            <form id="bidForm">
                <input type="text" id="name" placeholder="Legal Name" required />
                <input type="tel" id="phone" placeholder="Phone Number" required />
                <input type="number" id="amount" placeholder="Offer Amount (₦)" required />

                <div class="radio-group">
                    <label class="radio-option"><input type="radio" name="familyType" value="husband_and_wife"
                            required /><span class="radio-custom">Family</span></label>
                    <label class="radio-option"><input type="radio" name="familyType" value="single" /><span
                            class="radio-custom">Individual</span></label>
                </div>

                <input type="number" id="children" min="0" placeholder="Dependents" />
                <textarea id="message" rows="3" placeholder="Additional Notes"></textarea>

                <button type="submit" class="submit-btn">Submit Acquisition Offer</button>
            </form>
        </div>
    </div>

    <script>
        // --- PRESERVED FIREBASE & DATA LOGIC ---
        const firebaseConfig = {
            apiKey: "AIzaSyAHqg_u1DwWUB9l1vuoYDLKjCJl5Xx7Pbo",
            authDomain: "hauserng-77cc2.firebaseapp.com",
            projectId: "hauserng-77cc2",
            storageBucket: "hauserng-77cc2.appspot.com",
            messagingSenderId: "613578175402",
            appId: "1:613578175402:web:db7413f898987ac6a1f1d3"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function getSlugFromURL() {
            const path = window.location.pathname;
            return path.replace(/^\/|\/$/g, '').split('/')[0] || null;
        }

        async function loadAgencyPage() {
            const slug = getSlugFromURL();
            if (!slug || ['index.html', 'login.html', 'signup.html'].includes(slug)) { showError(); return; }

            try {
                const wsSnap = await db.collection('workspaces').where('slug', '==', slug).limit(1).get();
                if (wsSnap.empty) { showError(); return; }

                const data = wsSnap.docs[0].data();
                populateAgencyInfo(data);

                const propSnap = await db.collection('properties').where('uid', '==', data.ownerUid).get();
                const properties = propSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                renderProperties(properties);
                document.getElementById('propertyCount').textContent = properties.length;
                if (properties.length > 0) document.getElementById('statsBar').style.display = 'block';

                document.getElementById('loadingContainer').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                lucide.createIcons();
            } catch (err) { console.error(err); showError(); }
        }

        function populateAgencyInfo(data) {
            document.title = `${data.agencyName || 'Agency'} Portfolio`;
            document.getElementById('heroTitle').textContent = data.agencyName || 'Exquisite Portfolio';
            document.getElementById('navBrand').textContent = data.agencyName || 'Agency';
            document.getElementById('footerAgencyName').textContent = data.agencyName || 'Agency';

            if (data.logoUrl) {
                const logo = document.getElementById('navLogo');
                logo.src = data.logoUrl; logo.style.display = 'block';
                document.getElementById('navBrand').style.display = 'none';
            }

            if (data.heroVideoUrl) {
                const vid = document.getElementById('heroVideo');
                vid.src = data.heroVideoUrl; vid.style.display = 'block'; vid.play();
            } else if (data.heroImageUrl) {
                const img = document.getElementById('heroImage');
                img.src = data.heroImageUrl; img.style.display = 'block';
            }

            if (data.heroTagline) {
                document.getElementById('heroTagline').textContent = data.heroTagline;
                document.getElementById('heroTagline').style.display = 'block';
            }

            if (data.phone) {
                document.getElementById('navPhone').href = `tel:${data.phone}`;
                document.getElementById('navPhoneText').textContent = data.phone;
            }
            if (data.email) {
                document.getElementById('navEmail').href = `mailto:${data.email}`;
                document.getElementById('navEmailText').textContent = data.email;
            }
            document.getElementById('footerYear').textContent = new Date().getFullYear();
        }

        function renderProperties(properties) {
            const grid = document.getElementById('propertiesGrid');
            grid.innerHTML = '';
            properties.forEach(prop => grid.appendChild(createPropertyCard(prop)));
            lucide.createIcons();
        }

        function createPropertyCard(property) {
            const card = document.createElement('div');
            card.className = 'property-card';

            // Fixed Image/Video Logic
            const hasVideo = property.media?.some(m => m.type === 'video');
            const firstVideo = hasVideo ? property.media.find(m => m.type === 'video')?.url : null;
            const imageUrl = property.images?.[0] || property.media?.find(m => m.type === 'image')?.url || 'https://via.placeholder.com/600x400?text=Premium+Listing';

            const price = property.price ? `₦${parseFloat(property.price).toLocaleString()}` : 'Contact for Price';

            card.innerHTML = `
                <div class="property-image-container">
                    ${property.propertyType ? `<div class="property-badge">${property.propertyType}</div>` : ''}
                    ${firstVideo ?
                    `<video class="property-video" loop muted onmouseover="this.play()" onmouseout="this.pause();this.currentTime=0;"><source src="${firstVideo}" type="video/mp4"></video>`
                    : `<img src="${imageUrl}" class="property-image" loading="lazy">`
                }
                </div>
                <div class="property-content">
                    <div class="property-price">${price}</div>
                    <h3 class="property-title">${property.title || 'Untitled Estate'}</h3>
                    <div class="property-location"><i data-lucide="map-pin" size="14"></i><span>${property.location || 'Exquisite Location'}</span></div>
                    <button class="bid-btn" data-listing-id="${property.id}" data-owner-uid="${property.uid}" data-title="${property.title}">
                        Make Acquisition Offer
                    </button>
                </div>
            `;
            return card;
        }

        function showError() {
            document.getElementById('loadingContainer').style.display = 'none';
            document.getElementById('errorContainer').style.display = 'block';
        }

        // --- BID MODAL & SCROLL LOGIC ---
        let activeListing = null;

        document.addEventListener("click", (e) => {
            const btn = e.target.closest(".bid-btn");
            if (!btn) return;
            activeListing = { listingId: btn.dataset.listingId, ownerUid: btn.dataset.ownerUid, title: btn.dataset.title };
            document.getElementById("modalListingTitle").textContent = activeListing.title;
            document.getElementById("bidModal").classList.add("active");
        });

        document.getElementById("bidModal").addEventListener("click", (e) => {
            if (e.target.id === "bidModal" || e.target.classList.contains("close-modal-btn")) {
                document.getElementById("bidModal").classList.remove("active");
            }
        });

        document.getElementById("bidForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            if (!activeListing) return;

            try {
                // 1. Submit Bid
                await db.collection("bids").add({
                    listingId: activeListing.listingId,
                    listingOwnerUid: activeListing.ownerUid,
                    listingTitle: activeListing.title,
                    bidderName: document.getElementById("name").value,
                    bidderPhone: document.getElementById("phone").value,
                    bidAmount: Number(document.getElementById("amount").value),
                    familyType: document.querySelector('input[name="familyType"]:checked').value,
                    childrenCount: Number(document.getElementById("children").value || 0),
                    message: document.getElementById("message").value,
                    read: false,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                // 2. Update Bids Count
                await db.collection('properties').doc(activeListing.listingId).update({
                    bidsCount: firebase.firestore.FieldValue.increment(1)
                });

                alert("Acquisition offer submitted successfully.");
                document.getElementById("bidModal").classList.remove("active");
                e.target.reset();
            } catch (err) { alert("Error submitting offer."); console.error(err); }
        });

        window.addEventListener('scroll', () => {
            document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 80);
        });

        document.addEventListener('DOMContentLoaded', loadAgencyPage);
    </script>
</body>

</html>
